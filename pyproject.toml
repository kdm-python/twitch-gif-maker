[project]
name = "gifmaker"
version = "0.1.0"
description = ""
authors = [{ name = "Kyle Marden", email = "demolaze@Mac.home" }]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = ["pyside6 (>=6.11.1,<7.0.0)", "yt-dlp (>=2026.10.26,<2027.0.0)", "loguru (>=0.7.3,<0.8.0)"]

[project.scripts]
